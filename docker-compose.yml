services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama -d nakama"]
      interval: 3s
      timeout: 3s
      retries: 20
  nakama:
    image: heroiclabs/nakama:3.22.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /nakama/nakama migrate up --database.address nakama:${POSTGRES_PASSWORD:-change-this-password}@postgres:5432/nakama
        exec /nakama/nakama --name tagg --database.address nakama:${POSTGRES_PASSWORD:-change-this-password}@postgres:5432/nakama --logger.level INFO --runtime.path /nakama/data/modules --socket.server_key ${NAKAMA_SERVER_KEY:-defaultkey}
    ports:
      - "7350:7350"
      - "7351:7351"
    volumes:
      - ./server/modules:/nakama/data/modules:ro
volumes:
  postgres_data:
